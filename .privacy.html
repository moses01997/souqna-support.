<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082A5E">
  <meta name="description" content="SOUQNA Marketplace Privacy Policy">
  <title>SOUQNA | Privacy Policy</title>
  <style>
    :root {
      --navy: #082A5E;
      --blue: #1466C3;
      --gold: #FFBE32;
      --bg: #F4F7FC;
      --text: #172B4D;
      --muted: #60718C;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
      line-height: 1.8;
    }
    header {
      background: linear-gradient(135deg, #061D45, #1264C0);
      color: white;
      text-align: center;
      padding: 60px 20px 75px;
    }
    .logo {
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .accent {
      width: 65px;
      height: 5px;
      background: var(--gold);
      border-radius: 5px;
      margin: 16px auto;
    }
    header h1 { margin: 15px 0 5px; }
    header p { margin: 0; opacity: .9; }
    main {
      max-width: 850px;
      margin: -35px auto 40px;
      padding: 0 18px;
      position: relative;
    }
    .languages {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 22px;
    }
    button {
      background: white;
      color: var(--navy);
      border: 1px solid #D9E4F3;
      border-radius: 25px;
      padding: 10px 20px;
      font-weight: 700;
      cursor: pointer;
    }
    button.active {
      background: var(--navy);
      color: white;
    }
    .card {
      background: white;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 6px 25px rgba(8,42,94,.07);
      margin-bottom: 18px;
    }
    h2 {
      color: var(--navy);
      margin-top: 0;
      font-size: 21px;
    }
    p { margin: 0; }
    a {
      color: var(--blue);
      overflow-wrap: anywhere;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 600px) {
      header { padding: 45px 16px 65px; }
      .logo { font-size: 38px; }
      .card { padding: 21px; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">SOUQNA</div>
  <div class="accent"></div>
  <h1 id="heading">Privacy Policy</h1>
  <p id="subtitle">Your privacy matters to us.</p>
</header>

<main>
  <nav class="languages" aria-label="Language">
    <button data-lang="en" class="active">English</button>
    <button data-lang="ar">العربية</button>
    <button data-lang="fr">Français</button>
  </nav>

  <div id="sections"></div>
</main>

<footer>©️ 2026 SOUQNA. All rights reserved.</footer>

function setLanguage(lang) {
  const data = content[lang] || content.en;

  document.documentElement.lang = lang;
  document.documentElement.dir =
    lang === "ar" ? "rtl" : "ltr";

  document.getElementById("heading").textContent = data.heading;
  document.getElementById("subtitle").textContent = data.subtitle;

  const container = document.getElementById("sections");
  container.replaceChildren();

  data.sections.forEach(([title, description]) => {
    const section = document.createElement("section");
    section.className = "card";

    const heading = document.createElement("h2");
    heading.textContent = title;

    const paragraph = document.createElement("p");
    paragraph.textContent = description;

    section.append(heading, paragraph);
    container.appendChild(section);
  });

  document.querySelectorAll("[data-lang]").forEach(button => {
    const active = button.dataset.lang === lang;
    button.classList.toggle("active", active);
    button.setAttribute("aria-pressed", String(active));
  });
}

document.querySelectorAll("[data-lang]").forEach(button => {
  button.addEventListener("click", () => {
    setLanguage(button.dataset.lang);
  });
});

setLanguage("en");

</html>

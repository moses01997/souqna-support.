<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#082A5E">
  <meta name="description" content="SOUQNA is a global classifieds marketplace connecting buyers and sellers.">
  <title>عن سوقنا | SOUQNA</title>

  <style>
    :root {
      --navy: #082A5E;
      --blue: #1555A0;
      --bg: #F4F7FB;
      --text: #172B48;
      --muted: #66778F;
      --border: #E4EAF3;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Tahoma, Arial, sans-serif;
      line-height: 1.8;
    }

    header {
      background: linear-gradient(135deg, #082A5E, #1555A0);
      color: #FFFFFF;
      padding: 50px 20px 65px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    header p {
      margin: 6px 0;
    }

    .version {
      opacity: 0.75;
      font-size: 13px;
    }

    .language-bar {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 9px;
      margin-top: 22px;
    }

    .language-bar button {
      border: 1px solid #FFFFFF80;
      background: transparent;
      color: white;
      border-radius: 30px;
      padding: 8px 17px;
      font-size: 14px;
      cursor: pointer;
    }

    .language-bar button.active {
      background: #FFFFFF;
      color: var(--navy);
      font-weight: 700;
    }

    .language-bar button:focus-visible,
    .links a:focus-visible {
      outline: 3px solid #F5C542;
      outline-offset: 3px;
    }

    .container {
      position: relative;
      max-width: 820px;
      margin: -28px auto 35px;
      padding: 0 16px;
    }

    .card {
      background: white;
      padding: 26px;
      border-radius: 18px;
      border: 1px solid var(--border);
      margin-bottom: 16px;
      box-shadow: 0 5px 20px #082A5E09;
    }

    h2 {
      color: var(--navy);
      font-size: 21px;
      margin: 0 0 12px;
    }

    p {
      margin: 0;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
      margin-top: 15px;
    }

    .feature {
      background: #F2F6FC;
      border-radius: 13px;
      padding: 18px 12px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .feature span {
      display: block;
      font-size: 28px;
      margin-bottom: 6px;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 16px;
    }

    .links a {
      flex: 1;
      min-width: 145px;
      background: var(--navy);
      color: white;
      padding: 12px;
      border-radius: 11px;
      text-align: center;
      text-decoration: none;
      font-weight: 600;
    }

    .links a:hover {
      background: var(--blue);
    }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 10px 20px 35px;
    }

    @media (max-width: 480px) {
      header {
        padding: 40px 16px 58px;
      }

      header h1 {
        font-size: 36px;
      }

      .card {
        padding: 20px;
      }

      .feature {
        padding: 15px 8px;
      }

      .language-bar button {
        padding: 8px 13px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1 id="brand">سوقنا</h1>
    <p id="tagline">العالم في سوق واحد</p>
    <p class="version">SOUQNA · Version 1.0.0</p>

    <nav class="language-bar" aria-label="Language">
      <button id="arBtn" type="button" onclick="setLanguage('ar')">
        العربية
      </button>
      <button id="frBtn" type="button" onclick="setLanguage('fr')">
        Français
      </button>
      <button id="enBtn" type="button" onclick="setLanguage('en')">
        English
      </button>
    </nav>
  </header>

  <main class="container">

    <section class="card">
      <h2 id="aboutTitle"></h2>
      <p id="aboutText"></p>
    </section>

    <section class="card">
      <h2 id="visionTitle"></h2>
      <p id="visionText"></p>
    </section>

    <section class="card">
      <h2 id="featuresTitle"></h2>

      <div class="features">
        <div class="feature">
          <span>🚗</span>
          <div id="feature1"></div>
        </div>

        <div class="feature">
          <span>🏠</span>
          <div id="feature2"></div>
        </div>

        <div class="feature">
          <span>📱</span>
          <div id="feature3"></div>
        </div>

        <div class="feature">
          <span>🤝</span>
          <div id="feature4"></div>
        </div>

        <div class="feature">
          <span>💼</span>
          <div id="feature5"></div>
        </div>

        <div class="feature">
          <span>🛍️</span>
          <div id="feature6"></div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2 id="missionTitle"></h2>
      <p id="missionText"></p>
    </section>

    <section class="card">
      <h2 id="valuesTitle"></h2>
      <p id="valuesText"></p>
    </section>

    <section class="card">
      <h2 id="linksTitle"></h2>

      <div class="links">
        <a id="supportLink" href="./index.html"></a>
        <a id="privacyLink" href="./privacy.html"></a>
      </div>
    </section>

  </main>

  <footer>
    <p id="footerText"></p>
    <p>©️ 2026 SOUQNA. All rights reserved.</p>
  </footer>

  <script>
    const translations = {
      ar: {
        brand: "سوقنا",
        tagline: "العالم في سوق واحد",

        aboutTitle: "من نحن؟",
        aboutText:
          "سوقنا (SOUQNA) منصة إعلانات مبوبة عالمية تهدف إلى تسهيل البيع والشراء، من خلال جمع البائعين والمشترين في مكان واحد. نعمل على توفير تجربة بسيطة وسريعة تتيح للمستخدمين استكشاف المنتجات والخدمات والتواصل مع أصحاب الإعلانات.",

        visionTitle: "رؤيتنا",
        visionText:
          "أن يصبح سوقنا منصة عالمية رائدة للإعلانات المبوبة، تربط الأفراد والشركات وتساعد على تنمية التجارة وتوسيع فرص البيع والشراء بين المجتمعات والأسواق المختلفة.",

        featuresTitle: "ماذا يوفر سوقنا؟",
        feature1: "السيارات والمركبات",
        feature2: "العقارات والمنازل",
        feature3: "الجوالات والإلكترونيات",
        feature4: "التواصل بين البائع والمشتري",
        feature5: "الوظائف والخدمات",
        feature6: "اكتشاف الإعلانات والأسواق",

        missionTitle: "رسالتنا",
        missionText:
          "توفير منصة سهلة الاستخدام تتيح للأفراد والشركات نشر إعلاناتهم وعرض منتجاتهم وخدماتهم، ومساعدة المشترين على العثور على ما يبحثون عنه بطريقة منظمة وواضحة.",

        valuesTitle: "قيمنا",
        valuesText:
          "نؤمن بالبساطة والشفافية واحترام المستخدمين وتكافؤ الفرص. ونسعى باستمرار إلى تحسين تجربة الاستخدام وبناء مجتمع تجاري يقوم على الثقة والمسؤولية.",

        linksTitle: "روابط مهمة",
        supportLink: "تواصل معنا",
        privacyLink: "سياسة الخصوصية",
        footerText: "سوقنا — العالم في سوق واحد"
      },

      fr: {
        brand: "SOUQNA",
        tagline: "Le monde dans un seul marché",

        aboutTitle: "Qui sommes-nous ?",
        aboutText:
          "SOUQNA est une plateforme mondiale de petites annonces qui facilite l'achat et la vente en réunissant acheteurs et vendeurs au même endroit. Notre objectif est de proposer une expérience simple et rapide pour découvrir des produits, des services et contacter les annonceurs.",

        visionTitle: "Notre vision",
        visionText:
          "Devenir une plateforme mondiale de référence pour les petites annonces, reliant particuliers et entreprises et favorisant les échanges commerciaux entre différents marchés et communautés.",

        featuresTitle: "Que propose SOUQNA ?",
        feature1: "Voitures et véhicules",
        feature2: "Immobilier et logements",
        feature3: "Téléphones et électronique",
        feature4: "Contact entre acheteurs et vendeurs",
        feature5: "Emplois et services",
        feature6: "Découverte des annonces et marchés",

        missionTitle: "Notre mission",
        missionText:
          "Offrir une plateforme facile à utiliser permettant aux particuliers et aux entreprises de publier leurs annonces, de présenter leurs produits et services et de faciliter les recherches des acheteurs.",

        valuesTitle: "Nos valeurs",
        valuesText:
          "Nous croyons en la simplicité, la transparence, le respect des utilisateurs et l'égalité des chances. Nous cherchons constamment à améliorer l'expérience et à encourager des échanges responsables.",

        linksTitle: "Liens utiles",
        supportLink: "Contactez-nous",
        privacyLink: "Politique de confidentialité",
        footerText: "SOUQNA — Le monde dans un seul marché"
      },

      en: {
        brand: "SOUQNA",
        tagline: "The world in one marketplace",

        aboutTitle: "Who are we?",
        aboutText:
          "SOUQNA is a global classifieds marketplace designed to make buying and selling easier by connecting buyers and sellers in one place. We aim to provide a simple and convenient experience for discovering products, services, and contacting advertisers.",

        visionTitle: "Our vision",
        visionText:
          "To become a leading global classifieds marketplace that connects individuals and businesses, supports commerce, and expands buying and selling opportunities across different markets and communities.",

        featuresTitle: "What does SOUQNA offer?",
        feature1: "Cars and vehicles",
        feature2: "Real estate and homes",
        feature3: "Phones and electronics",
        feature4: "Buyer and seller communication",
        feature5: "Jobs and services",
        feature6: "Discovering listings and markets",

        missionTitle: "Our mission",
        missionText:
          "To provide an easy-to-use platform where individuals and businesses can publish listings, showcase products and services, and help buyers find what they need in an organized way.",

        valuesTitle: "Our values",
        valuesText:
          "We believe in simplicity, transparency, respect for users, and equal opportunity. We continuously aim to improve the user experience and encourage responsible trading within our community.",

        linksTitle: "Useful links",
        supportLink: "Contact us",
        privacyLink: "Privacy policy",
        footerText: "SOUQNA — The world in one marketplace"
      }
    };

    function setLanguage(lang) {
      const selectedLanguage =
        Object.prototype.hasOwnProperty.call(translations, lang)
          ? lang
          : "ar";

      const t = translations[selectedLanguage];

      document.documentElement.lang = selectedLanguage;
      document.documentElement.dir =
        selectedLanguage === "ar" ? "rtl" : "ltr";

      Object.keys(t).forEach(key => {
        const element = document.getElementById(key);

        if (element) {
          element.textContent = t[key];
        }
      });

      ["ar", "fr", "en"].forEach(code => {
        const button = document.getElementById(code + "Btn");

        if (button) {
          const active = code === selectedLanguage;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        }
      });

      document.title = t.aboutTitle + " | SOUQNA";

      try {
        localStorage.setItem(
          "souqna_about_language",
          selectedLanguage
        );
      } catch (error) {
        // Continue without local storage.
      }
    }

    function getInitialLanguage() {
      try {
        const saved = localStorage.getItem(
          "souqna_about_language"
        );

        if (Object.prototype.hasOwnProperty.call(translations, saved)) {
          return saved;
        }
      } catch (error) {
        // Continue with browser language.
      }

      const browserLanguage =
        (navigator.language || "ar").slice(0, 2).toLowerCase();

      return Object.prototype.hasOwnProperty.call(
        translations,
        browserLanguage
      )
        ? browserLanguage
        : "ar";
    }

    setLanguage(getInitialLanguage());
  </script>

</body>
</html>
